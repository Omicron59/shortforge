# Optionnel : lance le backend ShortForge dans un conteneur (developpement Linux/WSL).
# Sous Windows, l'usage normal est le sidecar Tauri ou `python -m shortforge`.
# ComfyUI et Ollama restent sur la machine hote (GPU).
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      SHORTFORGE_HOST: 0.0.0.0
      SHORTFORGE_DATA_DIR: /data
      COMFYUI_URL: http://host.docker.internal:8188
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
